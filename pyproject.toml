[project]
name = "all-voice"
version = "0.1.1"
description = "OpenAI-compatible, multi-backend TTS gateway (first backend: VieNeu-TTS)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Upper bound so a modern numba (via vieneu->librosa) can resolve; older
    # numba pins numpy and would drag in an unbuildable llvmlite.
    "numpy>=1.26,<2.3",
    "av>=13.0",
    "python-multipart>=0.0.9",
    "vieneu>=3.2.4",
]

[project.optional-dependencies]
# Voice cloning needs PyTorch. Preset synthesis runs torch-free on VieNeu's ONNX
# engine, but enrolling a clone runs VieNeu's speaker encoder, which uses torch
# for feature preprocessing even on the ONNX engine. This extra also enables the
# GPU/PyTorch engine — install it and set DEVICE=cuda (install torch from the
# PyTorch index for the right CUDA build).
clone = [
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
